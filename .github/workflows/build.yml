# Builds both architectures, runs all tests and makes the installer on every push and pull request.
# Pushing a tag vX.Y.Z (matching src/Version.h) also creates a draft GitHub release with the installer.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch McBopomofo and apply patches
        shell: pwsh
        run: ./tools/setup_third_party.ps1

      - name: Check that the tag matches src/Version.h
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $header = Get-Content src/Version.h -Raw
          if ($header -notmatch '#define ZY_VERSION_STRING "([0-9.]+)"') { throw 'version not found in src/Version.h' }
          if ("v$($Matches[1])" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match src/Version.h ($($Matches[1]))"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.5.4 --no-progress -y
            if ($LASTEXITCODE) { throw 'installing Inno Setup failed' }
          }

      - name: Build, test and package
        shell: pwsh
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: IdealismBopomofo-Setup
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: IdealismBopomofo-Setup
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum *.exe > SHA256SUMS.txt

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "微新注音 ${GITHUB_REF_NAME#v}" \
            --generate-notes
